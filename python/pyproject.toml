[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdc-segment"
version = "0.1.0"
description = "Modular Google Earth Engine Python API library for optical harmonization, CCDC temporal segmentation, synthetic reconstruction, and stability filtering."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
keywords = [
    "earth-engine",
    "gee",
    "ccdc",
    "remote-sensing",
    "landsat",
    "sentinel-2",
    "land-cover",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "earthengine-api>=0.1.380",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6.0",
]
dev = [
    "PyYAML>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gee: live Google Earth Engine integration tests (requires RUN_GEE_TESTS=1 and ee authentication)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ccdc_segment"]
